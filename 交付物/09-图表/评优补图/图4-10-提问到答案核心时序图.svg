<text x="215.0" y="1083" text-anchor="middle" font-size="11.5" font-weight="normal" fill="#37474F">200 {data, meta}（errors.ok）</text>
<rect x="60" y="1140" width="1480" height="120" rx="0" fill="#FFFDE7" stroke="#BCAAA4" stroke-width="1.3"/>
<text x="78" y="1166" text-anchor="start" font-size="13" font-weight="bold" fill="#4E342E">关键不变式</text>
<text x="90" y="1192" text-anchor="start" font-size="11.2" font-weight="bold" fill="#4E342E">① 五步契约不可重排：</text>
<text x="235" y="1192" text-anchor="start" font-size="10.8" font-weight="normal" fill="#4E342E">① 两路取候选 → ② 合并去重 → ③ 预算裁剪 → ④ 保留 K → ⑤ 呈现顺序＋图谱载荷（pipeline.FIVE_STEPS；D/E 组的时间过滤在第①步内）。</text>
<text x="90" y="1214" text-anchor="start" font-size="11.2" font-weight="bold" fill="#4E342E">② 证据集合冻结：</text>
<text x="235" y="1214" text-anchor="start" font-size="10.8" font-weight="normal" fill="#4E342E">assemble_case() 断言证据 chunk_id 顺序与 trace 的 final_evidence_chunk_ids 一致；生成侧不得重排、不得截断。</text>
<text x="90" y="1236" text-anchor="start" font-size="11.2" font-weight="bold" fill="#4E342E">③ 落库原子性：</text>
<text x="235" y="1236" text-anchor="start" font-size="10.8" font-weight="normal" fill="#4E342E">_next_ids() 与 _persist() 在同一 _DB_LOCK 内；answer_evidence 按 answer_id 先删旧再插新（同一事务）。</text>
<text x="800.0" y="1305" text-anchor="middle" font-size="20" font-weight="bold" fill="#263238">图 4-10　提问到答案的核心时序图</text>
</svg>
