[pytest]
# 交付物/03-代码\测试\pytest.ini —— 只声明**测试自己**的运行约定，不改动任何产品行为。
#
# 为什么放在这一层：`python -m pytest 交付物/03-代码\测试` 与 `python -m pytest 交付物/03-代码\测试\<file>`
# 两条命令的公共祖先是同一个目录，pytest 因此都能找到本文件、把 rootdir 定在这里，
# 于是"整体跑"与"逐文件跑"读到的是同一套约定（这是防串味的实测防线之一）。
#
# -p no:cacheprovider：不写 `.pytest_cache\`（本仓库 .gitignore 只排除 __pycache__，
#   测试运行不应往工作区里落缓存目录）。
# --strict-markers：用错标记名直接报错（本套只用内建的 parametrize／xfail）。
# xfail_strict = false：登记为"预期失败"的用例在日后被修好时会显示 XPASS（可见），
#   但**不会**让整轮变红——XPASS 是"该条登记项可能已修复"的信号，见 README 第四节。
addopts = -p no:cacheprovider --strict-markers
xfail_strict = false
testpaths = .
