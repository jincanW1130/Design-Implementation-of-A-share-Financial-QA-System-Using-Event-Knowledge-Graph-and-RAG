# 前端静态服务 ＋ /api 反向代理（第 4 轮 7.2）
#
# 两条口径：
#   ① 浏览器只访问前端同源（5173 → 容器 80），`/api/*` 由 nginx 转发到 backend:8000，
#      因此前端代码不需要知道后端地址，也不产生跨域；
#   ② nginx 为每个请求生成 `X-Request-Id` 并透传给后端：后端的请求 ID、访问日志、
#      指标与 qa_runs 的 out_dir 由此可以串成一条链路（8.3）。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 与后端 config.LIMITS["max_body_bytes"] 对齐（64 KiB），提前拒绝超大请求体。
    client_max_body_size 64k;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;

        # 问答链路是同步子进程，最长可达约 5 分钟（前端 320 s 超时）；代理读超时与之对齐。
        proxy_read_timeout 320s;
        proxy_send_timeout 320s;
    }

    # Vue Router 的 history 模式：未知路径回落到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 与后端一致的三项零风险安全头（CSP 由更上层的反代／静态服务器统一设，这里不越权）。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
}
